user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Format log chi tiết để Promtail dễ dàng thu thập và phân tích LogQL
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # ================================================================
    # BIỆN PHÁP BẢO MẬT (HARDENING)
    # ================================================================
    # 1. Ẩn thông tin phiên bản Nginx trong HTTP Header
    server_tokens off;

    # 2. Áp dụng các Security Headers chuẩn mực theo yêu cầu đề tài
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com https://fonts.gstatic.com https://cdnjs.cloudflare.com https://images.unsplash.com data:;" always;

    # Khai báo Upstream nội bộ trong Docker Network
    upstream webapp_backend {
        server web_pos:8000;
        keepalive 32;
    }

    upstream pma_backend {
        server phpmyadmin:80;
    }

    # ----------------------------------------------------------------
    # 1. Server HTTP (Port 80) - Tự động chuyển hướng toàn bộ sang HTTPS
    # ----------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name localhost pos.local;

        # Chuyển hướng 301 vĩnh viễn sang HTTPS
        return 301 https://$host$request_uri;
    }

    # ----------------------------------------------------------------
    # 2. Server HTTPS (Port 443) - Cấu hình SSL Tự Ký & Reverse Proxy
    # ----------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name localhost pos.local;

        # Chứng chỉ SSL/TLS tự ký
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Định tuyến vào Ứng dụng Web POS (Root)
        location / {
            proxy_pass http://webapp_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Định tuyến vào phpMyAdmin (/pma/)
        location /pma/ {
            proxy_pass http://pma_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Trang thông báo lỗi tùy biến
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
