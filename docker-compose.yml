version: '3.8'

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  monitor-net:
    driver: bridge

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  loki_data:

services:
  # 1. Nginx Reverse Proxy (Cổng giao tiếp Gateway trung tâm - SSL & Security Headers)
  nginx:
    image: nginx:alpine
    container_name: pos_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - frontend-net
    depends_on:
      - web_pos
      - phpmyadmin
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # 2. Ứng dụng Web POS & Quản lý Cửa hàng (Được bảo vệ phía sau Nginx)
  web_pos:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: pos_webapp
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - DB_HOST=db_mysql
      - DB_PORT=3306
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_NAME=${MYSQL_DATABASE}
    volumes:
      - ./app:/app
    networks:
      - frontend-net
      - backend-net
      - monitor-net
    depends_on:
      - db_mysql
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # 3. Cơ sở dữ liệu MySQL (Chỉ nằm trong mạng backend-net, cô lập tuyệt đối)
  db_mysql:
    image: mysql:8.0
    container_name: pos_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  # 4. Giao diện quản trị cơ sở dữ liệu trực quan phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: pos_phpmyadmin
    restart: unless-stopped
    expose:
      - "80"
    environment:
      PMA_HOST: db_mysql
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: /pma/
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - db_mysql

  # 5. Prometheus: Thu thập số liệu giám sát (Metrics Scraping)
  prometheus:
    image: prom/prometheus:latest
    container_name: pos_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitor-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # 6. cAdvisor: Giám sát tài nguyên phần cứng của tất cả container Docker
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: pos_cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitor-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # 7. Grafana: Hiển thị Dashboard trực quan hóa dữ liệu thời gian thực
  grafana:
    image: grafana/grafana:latest
    container_name: pos_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-AdminGrafana_2026!}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitor-net
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # 8. Loki: Máy chủ lưu trữ và lập chỉ mục Log tập trung
  loki:
    image: grafana/loki:2.9.2
    container_name: pos_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - monitor-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # 9. Promtail: Thu thập log từ tất cả các Container Docker và đẩy về Loki
  promtail:
    image: grafana/promtail:2.9.2
    container_name: pos_promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitor-net
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
