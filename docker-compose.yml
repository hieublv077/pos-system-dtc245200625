version: '3.8'

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

volumes:
  mysql_data:

services:
  # 1. Ứng dụng Web POS & Quản lý Cửa hàng
  web_pos:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: pos_webapp
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db_mysql
      - DB_PORT=3306
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_NAME=${MYSQL_DATABASE}
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - db_mysql
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # 2. Cơ sở dữ liệu MySQL
  db_mysql:
    image: mysql:8.0
    container_name: pos_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  # 3. Giao diện quản trị cơ sở dữ liệu trực quan phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: pos_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db_mysql
      PMA_PORT: 3306
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - db_mysql
